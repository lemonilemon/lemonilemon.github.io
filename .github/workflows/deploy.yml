name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow one concurrent deployment; let an in-progress one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # The CV is the only file taken from the private resume repo. Its read-only
  # deploy key can still read that whole repo, so the key stays in this job,
  # which runs only GitHub's own actions and Ubuntu's pdfinfo; the npm
  # packages in the build job never see it. The key is a secret of the cv
  # environment, which only main may use, so workflows on other branches
  # cannot read it either.
  cv:
    runs-on: ubuntu-latest
    environment:
      name: cv
      deployment: false
    permissions: {}
    outputs:
      updated: ${{ steps.updated.outputs.date }}
    steps:
      # The full history, for the date below, but only commits and trees:
      # the sparse checkout downloads no file's contents except CV/public.pdf.
      - name: Fetch the public CV
        uses: actions/checkout@v7
        with:
          repository: lemonilemon/resume
          ssh-key: ${{ secrets.RESUME_DEPLOY_KEY }}
          path: .resume
          fetch-depth: 0
          sparse-checkout: CV/public.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read when the CV last changed
        id: updated
        run: echo "date=$(git -C .resume log -1 --format=%cs -- CV/public.pdf)" >> "$GITHUB_OUTPUT"
      # Anyone can download a public repo's artifacts, so the stamp is checked
      # before the upload; the build checks it again (scripts/check-cv.ts).
      - name: Refuse anything but the public build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdfinfo .resume/CV/public.pdf | grep -Eq '^Subject: +Public version$' \
            || { echo '::error::CV/public.pdf lacks the "Public version" stamp'; exit 1; }
          mv .resume/CV/public.pdf cv.pdf
      - name: Hand the CV to the build
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: cv.pdf
          retention-days: 1
  # The site goes out even when the cv job fails: the CV page then says the
  # CV is not up yet, and the failed cv job still marks the run as failed.
  build:
    needs: cv
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The site's address (custom domain included) comes from the repo's
      # Pages settings; astro.config.ts reads it as SITE_URL.
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Put the CV in place
        if: ${{ needs.cv.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: cv
          path: public
      - name: Note the missing CV
        if: ${{ needs.cv.result != 'success' }}
        run: echo "::warning::The CV could not be fetched or checked, so this deploy shows 'The CV is not up yet.'"
      - name: Build with Astro
        uses: withastro/action@v6
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          CV_UPDATED: ${{ needs.cv.outputs.updated }}
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
