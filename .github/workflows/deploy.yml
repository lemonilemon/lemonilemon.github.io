name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Allow one concurrent deployment; let an in-progress one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The site's address (custom domain included) comes from the repo's
      # Pages settings; astro.config.ts reads it as SITE_URL.
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Export the site address
        run: echo "SITE_URL=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
      - name: Build with Astro
        uses: withastro/action@v6
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
